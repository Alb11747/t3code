name: Fork PR checks

# Optional hosted release checks. Agents normally validate locally and record
# an exact-commit report with fork/scripts/local-validation.cjs instead.
#
# Upstream PR branches start from upstream main and don't contain this file,
# so pushes to them can't trigger it. Start it from main instead:
#   gh workflow run fork-pr-checks.yml -R Alb11747/t3code -f ref=<branch-or-sha>

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to check
        required: true
        type: string

concurrency:
  group: fork-pr-checks-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  # The job budget reads the repository's recent runs.
  actions: read
  contents: read

jobs:
  budget:
    name: Job budget
    uses: ./.github/workflows/fork-budget.yml

  checks:
    name: Checks
    needs: [budget]
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/fork-checks.yml
    with:
      ref: ${{ inputs.ref }}
