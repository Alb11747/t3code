name: Fork job budget

# Fails a run before it spends runners once the fork has run too many jobs in
# the last 24 hours (fork/scripts/job-budget.sh). Fork release runs the same
# script inside its settle job instead, so a blocked release costs one job.
# Raise or lower the limit with the FORK_JOB_BUDGET repository variable.

on:
  workflow_call:

permissions:
  actions: read
  # Reads fork/scripts/job-budget.sh.
  contents: read

jobs:
  budget:
    name: Check job budget
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      LIMIT: ${{ vars.FORK_JOB_BUDGET || 150 }}
    steps:
      # Fetches only the script instead of checking out the repository.
      - run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/fork/scripts/job-budget.sh?ref=$GITHUB_SHA" > "$RUNNER_TEMP/job-budget.sh"
          bash "$RUNNER_TEMP/job-budget.sh"
