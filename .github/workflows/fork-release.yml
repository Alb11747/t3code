name: Fork release

# Builds and publishes the fork's desktop apps (Linux x64 AppImage, Windows x64
# installer) and CLI archives (Linux/Windows x64 and arm64, macOS arm64) as a
# GitHub prerelease. Installed desktop copies pick it up through the in-app
# updater. Versions extend the upstream nightly they're built on (see the
# version step), so installs follow the nightly update channel, and the build's
# update feed points at this repository (GITHUB_REPOSITORY).
#
# Upstream's release.yml also deploys services, publishes npm/AUR packages and
# signs builds with upstream's credentials. It is disabled in this fork; this
# workflow reuses only its desktop packaging job, release-desktop.yml, which
# skips signing when the signing secrets are absent.

on:
  push:
    branches: [main]
    paths-ignore:
      - "fork/*.md"
  workflow_dispatch:
    inputs:
      blocked_run_id:
        description: Labs only - failed Fork release run whose budget gate blocked
        type: string
      dry_run:
        description: Labs only - build and validate all assets without publishing
        type: boolean
        default: true

# A newer push cancels the older run, even mid-build: agents often push several
# fixes in a row, and building every one got the fork's Actions frozen
# (October 2026).
concurrency:
  # Labs pushes skip releases and must not cancel a manual fallback build.
  group: ${{ github.repository == 'Alb11747-Labs/t3code' && github.event_name != 'workflow_dispatch' && 'fork-release-ignored' || 'fork-release' }}
  cancel-in-progress: true

permissions:
  # The Windows job reads this run's artifact list to wait for the Linux CLI archive.
  actions: read
  contents: read

jobs:
  # The fork-release-delay environment (repository settings) has a 15-minute
  # wait timer, so a burst of pushes cancels itself here before any runner
  # starts and only the last push builds. It is short because a fork push is a
  # change wanted soon; upstream syncs settle in fork-sync.yml instead. Without
  # the environment there is no wait.
  #
  # It also disables upstream workflows that a sync or push added: they need
  # upstream's runners or credentials, or automate upstream's issues, and stay
  # active until disabled. Every change to main passes through here.
  #
  # It checks the job budget too, rather than a separate job: a push blocked by
  # the budget then costs one job, which lets an exhausted budget recover
  # sooner.
  settle:
    name: Wait for pushes to settle
    if: github.repository == 'Alb11747/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: fork-release-delay
    permissions:
      actions: write
      contents: read
      statuses: read
    outputs:
      release: ${{ steps.changes.outputs.release }}
      checked: ${{ steps.checked.outputs.checked }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LIMIT: ${{ vars.FORK_JOB_BUDGET || 150 }}
    steps:
      - run: echo "Releasing $GITHUB_SHA"

      - name: Disable upstream workflows
        run: |
          set -euo pipefail
          gh workflow list --all --limit 500 --json path,state --jq '.[] | select(.state == "active") | .path' |
            while read -r path; do
              case "$(basename "$path")" in
                fork-* | release-desktop.yml) ;;
                *) gh workflow disable "$(basename "$path")" ;;
              esac
            done

      # paths-ignore compares against where the old and new history split, so
      # folding a fork/*.md fix into an older commit still starts a release.
      # Compare files with the newest published release instead; only tree
      # objects are fetched.
      - id: changes
        name: Skip docs-only changes
        run: |
          set -euo pipefail
          last=$(gh release list --exclude-drafts --limit 100 --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | last | .tagName // ""')
          release=true
          if [[ -n $last ]]; then
            git init --quiet
            git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
            git fetch --quiet --no-tags --depth=1 --filter=blob:none origin \
              "refs/tags/$last:refs/last" "$GITHUB_SHA:refs/head"
            # Assigned first so a failed diff fails the job instead of skipping.
            changed=$(git diff --name-only --no-renames refs/last refs/head -- . ':(glob,exclude)fork/*.md')
            if [[ -z $changed ]]; then
              echo "Only fork/*.md changed since $last; skipping the release."
              release=false
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Check job budget
        if: steps.changes.outputs.release == 'true'
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/fork/scripts/job-budget.sh?ref=$GITHUB_SHA" > "$RUNNER_TEMP/job-budget.sh"
          bash "$RUNNER_TEMP/job-budget.sh"

      # Fork checks sets a `fork-checks` status on a commit once every check
      # passed there, naming the commit its workflow file came from. When a sync
      # candidate or Fork PR checks run already passed on this exact commit,
      # with the same checks this commit defines, running them again proves
      # nothing new.
      - id: checked
        name: Reuse checks that passed on this commit
        if: steps.changes.outputs.release == 'true'
        run: |
          set -euo pipefail
          checks_file=.github/workflows/fork-checks.yml
          status=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" \
            --jq '.statuses[] | select(.context == "fork-checks" and .state == "success") | .description')
          checked=false
          if [[ $status =~ ^checks@([0-9a-f]{40})$ ]]; then
            used=$(gh api "repos/$GITHUB_REPOSITORY/contents/$checks_file?ref=${BASH_REMATCH[1]}" --jq .sha)
            here=$(gh api "repos/$GITHUB_REPOSITORY/contents/$checks_file?ref=$GITHUB_SHA" --jq .sha)
            if [[ $used == "$here" ]]; then
              checked=true
              echo "Fork checks already passed on $GITHUB_SHA; skipping them."
            fi
          fi
          echo "checked=$checked" >> "$GITHUB_OUTPUT"

  fallback:
    name: Verify budget fallback
    if: github.repository == 'Alb11747-Labs/t3code' && github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.FORK_RELEASE_LINUX_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      # Public fetch avoids checkout's credential cleanup traversing orphaned
      # gitlinks, even when sparse checkout excludes the .repos directory.
      - name: Checkout workflow helpers
        run: |
          set -euo pipefail
          git init .
          git config remote.origin.url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/fork/scripts/'
          git -c checkout.workers=0 checkout --force --detach FETCH_HEAD
          git clean -ffdx
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCKED_RUN_ID: ${{ inputs.blocked_run_id }}
        run: node fork/scripts/release-fallback.cjs

  preflight:
    name: Preflight
    needs: [settle, fallback]
    if: >-
      always() && !cancelled() &&
      ((needs.settle.result == 'success' && needs.settle.outputs.release == 'true') ||
      needs.fallback.result == 'success')
    runs-on: ${{ github.repository == 'Alb11747/t3code' && 'ubuntu-24.04' || vars.FORK_RELEASE_LINUX_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Alb11747/t3code
          ref: ${{ needs.fallback.outputs.sha || github.sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      # Versions are the upstream nightly the fork is built on plus `.fork` or
      # `.fork.<n>`; fork/scripts/release-version.cjs explains the numbering.
      - id: meta
        name: Resolve release version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: Alb11747/t3code
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet https://github.com/pingdotgg/t3code.git main
          base=$(git merge-base HEAD FETCH_HEAD)
          # The newest upstream nightly at or below the fork's upstream base.
          # Annotated tags also list their peeled commit (`^{}`), which is the
          # one present locally.
          upstream_tag=""
          while read -r sha ref; do
            if git merge-base --is-ancestor "$sha" "$base" 2>/dev/null; then
              upstream_tag=${ref#refs/tags/}
              break
            fi
          done < <(git ls-remote --tags https://github.com/pingdotgg/t3code.git 'v*-nightly.*' \
            | sed 's/\^{}$//' | sort -k2,2 -V -r)
          [[ -n $upstream_tag ]] || { echo "::error::No upstream nightly found under $base."; exit 1; }
          gh api --paginate --slurp "repos/$RELEASE_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/fork-releases.json"
          version=$(node fork/scripts/release-version.cjs \
            "$RUNNER_TEMP/fork-releases.json" "$upstream_tag" "$RELEASE_REPOSITORY" FETCH_HEAD)
          sha=$(git rev-parse HEAD)
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "name=T3 Code Fork $version (${sha::12})"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_REPOSITORY: Alb11747/t3code
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet https://github.com/pingdotgg/t3code.git main
          node fork/scripts/release-notes.cjs \
            "$RUNNER_TEMP/fork-releases.json" "$RELEASE_TAG" "$RELEASE_REPOSITORY" FETCH_HEAD \
            > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

  checks:
    name: Checks
    needs: [settle, preflight]
    # Explicit status checks allow the skipped alternate release path, while
    # preserving an exact-source pass reused by the normal fork release.
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.settle.outputs.checked != 'true' }}
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/fork-checks.yml
    with:
      repository: Alb11747/t3code
      ref: ${{ needs.preflight.outputs.sha }}

  # Builds wait for the checks so a failing commit doesn't also spend the
  # desktop builds. Checks skipped because they already passed count as
  # passed; GitHub would otherwise skip every job that depends on them, so
  # the jobs below test results explicitly.
  build_bundle:
    name: Build JS bundle
    needs: [settle, preflight, checks]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && needs.settle.outputs.checked == 'true')) }}
    runs-on: ${{ github.repository == 'Alb11747/t3code' && 'ubuntu-24.04' || vars.FORK_RELEASE_LINUX_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    # T3 Connect needs upstream's Clerk/relay deployment. These optional
    # repository variables bake in public client values; without them the
    # build has no T3 Connect sign-in, and everything else works.
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.RELAY_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Alb11747/t3code
          ref: ${{ needs.preflight.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Install browser secret helper build libraries
        run: |
          # Lazarus runners are rootless; their image supplies build libraries.
          if command -v sudo >/dev/null; then
            sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
          else
            pkg-config --exists libsecret-1
          fi

      - name: Build JS bundle
        run: vp run build:desktop

      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # Labels must stay "Linux x64": the Windows job waits for a job named
  # "Build Linux x64" to upload the Linux CLI archive it embeds for WSL.
  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      repository: Alb11747/t3code
      release_repository: Alb11747/t3code
      ref: ${{ needs.preflight.outputs.sha }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      clerk_jwt_template: ${{ vars.CLERK_JWT_TEMPLATE }}
      clerk_cli_oauth_client_id: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      relay_url: ${{ vars.RELAY_URL }}
      label: Linux x64
      runner: ${{ github.repository == 'Alb11747/t3code' && 'ubuntu-24.04' || vars.FORK_RELEASE_LINUX_RUNNER || 'blacksmith-8vcpu-ubuntu-2404' }}
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true

  desktop_win_x64:
    name: Desktop Windows x64
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      repository: Alb11747/t3code
      release_repository: Alb11747/t3code
      ref: ${{ needs.preflight.outputs.sha }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      clerk_jwt_template: ${{ vars.CLERK_JWT_TEMPLATE }}
      clerk_cli_oauth_client_id: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      relay_url: ${{ vars.RELAY_URL }}
      label: Windows x64
      # Cross-built on Linux and verified on Windows, as upstream does.
      # GitHub-hosted in Labs too: free for public repositories, so the
      # fallback spends no Blacksmith usage on Windows.
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true

  # ARM remotes use the same fork release feed as x64. Package their CLI
  # archives on native runners without building additional desktop installers.
  cli_arm64:
    name: CLI ${{ matrix.resource_key }}
    needs: [preflight, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
          - runner: ${{ github.repository == 'Alb11747/t3code' && 'ubuntu-24.04-arm' || 'blacksmith-4vcpu-ubuntu-2404-arm' }}
            platform: linux
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
          - runner: windows-11-arm
            platform: win
            rust_target: aarch64-pc-windows-msvc
            resource_key: win32-arm64
    defaults:
      run:
        shell: bash
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.RELAY_URL }}
    steps:
      # Match release-desktop's checkout: no credentials or submodule cleanup
      # for the orphaned gitlinks in the excluded .repos tree.
      - name: Checkout
        env:
          GIT_TERMINAL_PROMPT: "0"
          CHECKOUT_REF: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/Alb11747/t3code.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false

      - name: Install CLI dependencies
        run: vp install --filter=t3... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # Extract at apps/ to retain server/dist/client from the checked bundle.
      - name: Download JS bundle
        uses: actions/download-artifact@v8
        with:
          name: js-bundle
          path: apps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.ARM64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"

      - name: Build CLI single-executable
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor for the CLI archive
        run: |
          set -euo pipefail
          binary_name="t3-resource-monitor"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            binary_name="${binary_name}.exe"
          fi
          target_dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/${binary_name}" "$target_dir/$binary_name"

      # The archive script signs macOS binaries ad hoc without credentials.
      - name: Build CLI archive
        run: |
          node scripts/build-cli-archive.ts \
            --platform "${{ matrix.platform }}" \
            --arch arm64 \
            --version "${{ needs.preflight.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.preflight.outputs.version }}"

      - name: Upload CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}-arm64
          path: release-cli/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: [preflight, desktop_linux_x64, desktop_win_x64, cli_arm64]
    if: >-
      !cancelled() && needs.preflight.result == 'success' &&
      needs.desktop_linux_x64.result == 'success' && needs.desktop_win_x64.result == 'success' &&
      needs.cli_arm64.result == 'success'
    runs-on: ${{ github.repository == 'Alb11747/t3code' && 'ubuntu-24.04' || vars.FORK_RELEASE_LINUX_RUNNER || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout workflow helpers
        run: |
          set -euo pipefail
          git init .
          git config remote.origin.url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/fork/scripts/'
          git -c checkout.workers=0 checkout --force --detach FETCH_HEAD
          git clean -ffdx
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      # The Windows job suffixes its updater manifest with the arch so x64 and
      # arm64 cannot collide; with x64 only, restore the name the updater reads.
      - name: Prepare release assets
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          for manifest in *-win-x64.yml; do
            mv "$manifest" "${manifest%-win-x64.yml}.yml"
          done
          # Require both desktop installers/feeds and all five CLI archives
          # before checksumming or publishing a release used by remote installs.
          for required in '*.AppImage' '*.exe' nightly.yml nightly-linux.yml \
            "t3-${RELEASE_VERSION}-linux-x64.tar.gz" \
            "t3-${RELEASE_VERSION}-win32-x64.zip" \
            "t3-${RELEASE_VERSION}-darwin-arm64.tar.gz" \
            "t3-${RELEASE_VERSION}-linux-arm64.tar.gz" \
            "t3-${RELEASE_VERSION}-win32-arm64.zip"; do
            compgen -G "$required" > /dev/null || { echo "Missing release asset: $required" >&2; exit 1; }
          done
          sha256sum t3-*.tar.gz t3-*.zip > SHA256SUMS
          node -e 'require("../fork/scripts/publish-release.cjs").releaseAssets(".", process.env.RELEASE_VERSION)'
          ls -la

      - name: Publish release
        if: github.repository == 'Alb11747/t3code' || !inputs.dry_run
        env:
          # The cross-repository credential is exposed only here, never to
          # builds, dependency installation, or artifact download steps.
          GH_TOKEN: ${{ github.repository == 'Alb11747/t3code' && github.token || secrets.FORK_RELEASE_TOKEN }}
          GH_REPO: Alb11747/t3code
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
          RELEASE_NAME: ${{ needs.preflight.outputs.name }}
        run: node fork/scripts/publish-release.cjs
